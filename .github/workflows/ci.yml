name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Verify safe scanner and release-privacy reports
        run: python -m unittest discover -s tests/scripts -p 'test_*.py'

      - name: Scan reachable history and source archive (redacted, pinned scanner)
        run: ./scripts/Invoke-CiSecretScan.ps1

      - name: Locked restore (all transitive advisories, warnings as errors)
        run: dotnet restore Wintodo.sln --locked-mode -p:Platform=x64 -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -warnaserror

      - name: Audit direct and transitive dependencies
        run: ./scripts/Invoke-CiDependencyAudit.ps1

      - name: Verify runner, native tools and restored CLI versions
        run: ./scripts/Export-CiToolchain.ps1 -Architecture x64

      - name: Build (x64 Debug, warnings as errors, WinUI + AOT analyzers)
        run: dotnet build Wintodo.sln -p:Platform=x64 -warnaserror --no-restore

      - name: Verify diagnostic-safe test export
        run: ./tests/scripts/Test-SafeTestResults.ps1

      - name: Unit tests (Core, Data, Sync, Import — xunit v3 on Microsoft Testing Platform)
        run: >
          dotnet test --solution Wintodo.sln -p:Platform=x64 --no-build
          --report-trx --coverage --results-directory TestResults

      - name: Export diagnostic-safe test summary
        if: always()
        run: ./scripts/Export-SafeTestResults.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: |
            SafeTestResults/summary.json
            SafeTestResults/secrets-history.json
            SafeTestResults/secrets-tree.json
            SafeTestResults/dependencies.json
            SafeTestResults/toolchain.json
          retention-days: 14
          if-no-files-found: error

  release:
    # Default-branch maintenance and writable tags only; no signing authority.
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build-and-test
    runs-on: windows-2025
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
          - platform: ARM64
            arch: arm64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Locked restore target AOT dependencies (all advisories, warnings as errors)
        run: >
          dotnet restore src/Wintodo.App/Wintodo.csproj -r win-${{ matrix.arch }}
          --locked-mode -p:Configuration=Release
          -p:Platform=${{ matrix.platform }} -p:PublishAot=true -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=true -p:PublishReadyToRun=false
          -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -warnaserror

      - name: Verify target native toolchain before publishing
        run: ./scripts/Export-CiToolchain.ps1 -Architecture ${{ matrix.arch }} -RequireAot

      - name: Publish Native AOT (self-contained, warnings as errors)
        run: ./scripts/Publish-Aot.ps1 -Platforms ${{ matrix.platform }}

      - name: Build unsigned MSIX with the restored WinApp CLI
        run: |
          [xml]$packages = Get-Content Directory.Packages.props
          $version = ($packages.Project.ItemGroup.PackageVersion |
            Where-Object Include -eq 'Microsoft.Windows.SDK.BuildTools.WinApp').Version
          $cli = Join-Path $env:USERPROFILE ".nuget/packages/microsoft.windows.sdk.buildtools.winapp/$version/tools/win-x64/winapp.exe"
          if (-not (Test-Path -LiteralPath $cli)) { throw 'Restored WinApp CLI was not found.' }
          $output = Join-Path $PWD 'publish/msix/Wintodo-${{ matrix.arch }}.msix'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $output) | Out-Null
          # Target AOT restore above supplies the approved graph. WinApp's default
          # solution restore would also request unsupported AOT locks for tests.
          & $cli package src/Wintodo.App/Wintodo.csproj --arch ${{ matrix.arch }} --no-sign --self-contained --no-restore `
            -p Platform=${{ matrix.platform }} -p PublishAot=true -p SelfContained=true `
            -p PublishTrimmed=true -p PublishReadyToRun=false -p TreatWarningsAsErrors=true `
            -p RestoreLockedMode=true --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned MSIX packaging failed.' }
          if (-not (Test-Path -LiteralPath $output)) { throw 'MSIX artifact was not produced.' }

      - name: Audit final resolved dependency graph after packaging
        run: ./scripts/Invoke-CiDependencyAudit.ps1 -AppOnly -Architecture ${{ matrix.arch }}

      - name: Record final resolved AOT and toolchain versions after packaging
        run: ./scripts/Export-CiToolchain.ps1 -Architecture ${{ matrix.arch }} -RequireAot

      - name: Verify exact unsigned layout, MSIX and public metadata privacy
        run: >
          python scripts/Test-ReleasePrivacy.py publish/aot/win-${{ matrix.arch }}
          publish/msix/Wintodo-${{ matrix.arch }}.msix publish/aot/summary.json
          SafeTestResults/toolchain.json SafeTestResults/dependencies.json
          --require-architecture ${{ matrix.platform }}
          --private-root "$PWD"
          --output SafeTestResults/release-privacy.json

      - name: Inspect exact unsigned MSIX structure against the reviewed manifest
        run: |
          [xml]$candidateManifest = Get-Content -LiteralPath src/Wintodo.App/Package.appxmanifest
          $candidateIdentity = $candidateManifest.Package.Identity
          python scripts/Test-ReleasePackage.py publish/msix/Wintodo-${{ matrix.arch }}.msix `
            --architecture ${{ matrix.platform }} --output SafeTestResults/release-package.json `
            --expected-identity $candidateIdentity.GetAttribute('Name') `
            --expected-publisher $candidateIdentity.GetAttribute('Publisher') `
            --expected-version $candidateIdentity.GetAttribute('Version')
          if ($LASTEXITCODE -ne 0) { throw 'MSIX structural inspection failed.' }

      - name: Export exact-package dependency evidence (retained-code closure pending)
        run: |
          $candidatePath = 'publish/msix/Wintodo-${{ matrix.arch }}.msix'
          $candidateHash = (Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          python scripts/Export-ReleaseSbom.py $candidatePath `
            --assets src/Wintodo.App/obj/project.assets.json --architecture ${{ matrix.platform }} `
            --source-commit $env:GITHUB_SHA --expected-package-sha256 $candidateHash `
            --output SafeTestResults/release-sbom.json
          if ($LASTEXITCODE -ne 0) { throw 'Package dependency evidence export failed.' }
          python scripts/Test-ReleasePrivacy.py SafeTestResults/release-sbom.json `
            --private-root "$PWD" --output SafeTestResults/release-sbom-privacy.json
          if ($LASTEXITCODE -ne 0) { throw 'Package dependency evidence privacy check failed.' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M10-unsigned-${{ matrix.arch }}
          path: |
            publish/msix/Wintodo-${{ matrix.arch }}.msix
            publish/aot/summary.json
            SafeTestResults/dependencies.json
            SafeTestResults/toolchain.json
            SafeTestResults/release-privacy.json
            SafeTestResults/release-package.json
            SafeTestResults/release-sbom.json
            SafeTestResults/release-sbom-privacy.json
          retention-days: 14
          if-no-files-found: error
