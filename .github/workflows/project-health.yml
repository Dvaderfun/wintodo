name: Project health

on:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare checked-in pins with upstream releases
        run: python3 scripts/Check-ProjectHealth.py --markdown "$GITHUB_STEP_SUMMARY"

  prepare-vendor-patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified WinUI skills and Gitleaks changes
        id: prepare
        run: |
          patch="$RUNNER_TEMP/wintodo-vendor-update.patch"
          python3 scripts/Prepare-VendorUpdates.py --output "$patch"
          if [ -f "$patch" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Review the vendor-update patch artifact against commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.prepare.outputs.ready == 'true'
        with:
          name: vendor-update-${{ github.sha }}
          path: ${{ runner.temp }}/wintodo-vendor-update.patch
          if-no-files-found: error
          retention-days: 14
