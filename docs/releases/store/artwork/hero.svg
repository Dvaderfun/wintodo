<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>One more thing, done</title>
  <desc>A spiral-bound paper list with two teal check marks, an open box and a sharpened yellow pencil. The lower third is an empty mint tabletop.</desc>
  <defs>
    <!-- The open back and the highlight on each wire suggest a real binding. -->
    <g id="wire">
      <ellipse cx="0" cy="45" rx="14" ry="10" fill="#BABEB4"/>
      <ellipse cx="0" cy="44" rx="9" ry="6" fill="#46635D"/>
      <path d="M-12-9c-5-21-4-33 6-35 13-3 21 11 19 31L7 34c-1 7-3 11-7 11"
            fill="none" stroke="#365852" stroke-width="11" stroke-linecap="round"/>
      <path d="M-7-35c5-11 15-3 16 10" fill="none" stroke="#A8C0AE" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <rect id="cover" width="632" height="548" rx="22"/>
    <rect id="leaf" width="598" height="511" rx="14"/>
    <rect id="box" x="0" y="0" width="63" height="63" rx="12" fill="none" stroke-width="7"/>
  </defs>

  <rect width="1920" height="1080" fill="#DCEDE7"/>

  <!-- Foreshortened paper, cut edges and a hard cast shadow; no lighting filters. -->
  <g transform="matrix(1.08 -.116 -.205 .916 773 178)">
    <use href="#cover" transform="translate(42 43)" fill="#C3D9CE"/>
    <use href="#cover" transform="translate(9 20)" fill="#176461"/>
    <use href="#cover" transform="translate(5 12)" fill="#24877D"/>
    <use href="#cover" transform="translate(0 5)" fill="#35AA97"/>

    <!-- Two dividers tuck between the leaves. -->
    <path d="M592 99h51q11 0 11 10v52q0 11-11 11h-51z" fill="#A9A1D5"/>
    <path d="M592 185h51q11 0 11 10v53q0 10-11 10h-51z" fill="#E3AB76"/>
    <use href="#leaf" transform="translate(16 22)" fill="#C4CCC0"/>
    <use href="#leaf" transform="translate(15 16)" fill="#F0ECDA"/>
    <use href="#leaf" transform="translate(14 10)" fill="#DCDCCB"/>
    <use href="#leaf" transform="translate(13 3)" fill="#FFFBEB"/>
    <path d="M31 81H594" fill="none" stroke="#E1DFCD" stroke-width="2"/>

    <g>
      <use href="#wire" x="89"/><use href="#wire" x="176"/><use href="#wire" x="263"/>
      <use href="#wire" x="350"/><use href="#wire" x="437"/><use href="#wire" x="524"/>
    </g>

    <!-- Three ruled tasks. Two expressive ticks cross the printed outlines. -->
    <g transform="translate(85 122)">
      <use href="#box" stroke="#98B0A6"/>
      <path d="M9 27q10 7 18 19C43 24 59 9 81-10" fill="none" stroke="#087E77" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M123 29h299m-299 19h189" fill="none" stroke="#BBC6B7" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(85 246)">
      <use href="#box" stroke="#98B0A6"/>
      <path d="M10 31q9 4 16 15C39 30 56 12 72-1" fill="none" stroke="#087E77" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M123 29h218m-218 19h125" fill="none" stroke="#BBC6B7" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(85 370)">
      <use href="#box" stroke="#506D67"/>
      <path d="M123 30h245" fill="none" stroke="#779085" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- A hexagonal pencil points back to the freshly made second tick. -->
  <g transform="translate(899 402) rotate(-18)">
    <path d="m25 15 83-21h501q14 0 14 13v13q0 12-14 12H108z" fill="#244D46" opacity=".12"/>
    <path d="m0 0 87-20 12 19-12 21z" fill="#E9BA88"/>
    <path d="m0 0 87 2v18z" fill="#C99163"/>
    <path d="m0 0 22-5 5 5-5 5z" fill="#344C49"/>
    <path d="M85-20h469v40H85l9-10-8-9 8-10z" fill="#F0B14A"/>
    <path d="M85-20h469v11H94z" fill="#FFD77B"/>
    <path d="M94 10h460v10H85z" fill="#CB8736"/>
    <path d="M552-20h26v40h-26z" fill="#81978F"/>
    <path d="M552-20h26v10h-26z" fill="#BECDC1"/>
    <path d="M552 10h26v10h-26z" fill="#617F77"/>
    <path d="M577-20h26q13 0 13 13V7q0 13-13 13h-26z" fill="#CA806A"/>
    <path d="M577-20h26q10 0 13 11h-39z" fill="#E8A18A"/>
  </g>
</svg>
